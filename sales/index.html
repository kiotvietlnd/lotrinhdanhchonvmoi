<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lộ Trình Đào Tạo KiotViet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #eef2f8;
    --surface: #ffffff;
    --ink: #172033;
    --muted: #5d6b82;
    --line: #e1e7f0;
    --head: #f3f6fb;
    --accent: #1d4ed8;
    --accent-ink: #ffffff;
    --test: #be123c;
    --test-bg: #fff1f4;
    --test-line: #fbcfd8;
    --w1-bg: #eef4ff; --w1-cell: #f6f9ff; --w1-pill: #dbe8ff; --w1-ink: #1e3a8a; --w1-bar: #3b82f6;
    --w2-bg: #e9f9f0; --w2-cell: #f4fcf8; --w2-pill: #cdf3dc; --w2-ink: #14532d; --w2-bar: #22a05b;
    --w3-bg: #fff6dc; --w3-cell: #fffbee; --w3-pill: #fde9a8; --w3-ink: #713f12; --w3-bar: #e0a21b;
    --w4-bg: #f5f0ff; --w4-cell: #faf7ff; --w4-pill: #ebdcfc; --w4-ink: #581c87; --w4-bar: #8b5cf6;
    --tip-bg: #1b2540;
    --tip-ink: #ffffff;
    --tip-line: rgba(255, 255, 255, .22);
    --shadow: 0 1px 2px rgba(23, 32, 51, .05), 0 6px 20px rgba(23, 32, 51, .06);
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1424; --surface: #141c2f; --ink: #e8edf7; --muted: #93a1ba; --line: #26314a; --head: #1a2338;
      --accent: #6b9bff; --accent-ink: #0d1424;
      --test: #fb7a97; --test-bg: #2a1620; --test-line: #4d2433;
      --w1-bg: #14223f; --w1-cell: #121c33; --w1-pill: #213a6b; --w1-ink: #bcd2ff; --w1-bar: #5b8def;
      --w2-bg: #11291f; --w2-cell: #10211b; --w2-pill: #1d4a35; --w2-ink: #b5eccd; --w2-bar: #3fbf80;
      --w3-bg: #2d2610; --w3-cell: #231e10; --w3-pill: #5a4812; --w3-ink: #fbe3a0; --w3-bar: #e7b43a;
      --w4-bg: #26163b; --w4-cell: #1c112b; --w4-pill: #472075; --w4-ink: #ebd5ff; --w4-bar: #9d5cf7;
      --tip-bg: #2a375a; --tip-ink: #ffffff; --tip-line: rgba(255, 255, 255, .22);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page { max-width: 1200px; margin-inline: auto; display: grid; gap: 16px; }

  /* Header */
  .top {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo {
    flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: .02em;
  }
  h1 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

  /* Department Switcher */
  .dept-selector {
    display: flex; gap: 6px; padding: 4px; background: var(--head); border: 1px solid var(--line); border-radius: 12px;
  }
  .dept-btn {
    font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); background: transparent; border: 0;
    padding: 8px 20px; border-radius: 8px; cursor: pointer; transition: all .15s ease;
  }
  .dept-btn:hover { color: var(--ink); }
  .dept-btn[aria-selected="true"] {
    background: var(--surface); color: var(--accent); box-shadow: 0 1px 4px rgba(23, 32, 51, .12);
  }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px;
  }
  .filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--head); border: 1px solid var(--line); border-radius: 10px; }
  .seg button {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: transparent; border: 0;
    padding: 5px 12px; border-radius: 7px; cursor: pointer;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(23, 32, 51, .15); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Table */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; min-width: 760px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  table.single-col { min-width: 0; }
  th, td { padding: 0; text-align: left; vertical-align: middle; }
  thead th {
    background: var(--head); border-bottom: 1px solid var(--line); padding: 14px 18px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink);
  }
  thead th + th { border-left: 1px solid var(--line); }
  .col-time { width: 154px; }
  thead .col-time { position: sticky; left: 0; z-index: 2; }

  td.phase {
    position: sticky; left: 0; z-index: 1; text-align: center; padding: 14px 10px;
    border-top: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--bar);
  }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 8px; font-weight: 700; font-size: 13.5px; background: var(--pill); color: var(--pink); }
  .phase small { display: block; margin-top: 6px; font-size: 11px; line-height: 1.35; color: var(--pink); opacity: .85; }

  tr.w1 { --bar: var(--w1-bar); --pill: var(--w1-pill); --pink: var(--w1-ink); --cell: var(--w1-cell); --tint: var(--w1-bg); }
  tr.w2 { --bar: var(--w2-bar); --pill: var(--w2-pill); --pink: var(--w2-ink); --cell: var(--w2-cell); --tint: var(--w2-bg); }
  tr.w3 { --bar: var(--w3-bar); --pill: var(--w3-pill); --pink: var(--w3-ink); --cell: var(--w3-cell); --tint: var(--w3-bg); }
  tr.w4 { --bar: var(--w4-bar); --pill: var(--w4-pill); --pink: var(--w4-ink); --cell: var(--w4-cell); --tint: var(--w4-bg); }

  td.phase { background: var(--tint); }
  td.item { background: var(--cell); padding: 12px 18px; border-top: 1px solid color-mix(in srgb, var(--bar) 14%, transparent); border-left: 1px solid color-mix(in srgb, var(--bar) 14%, transparent); }
  tr.first td.phase, tr.first td.item { border-top-color: var(--line); }

  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .line + .line { margin-top: 6px; }
  .line span.t { min-width: 0; overflow-wrap: anywhere; }
  .line span.na { color: var(--muted); font-size: 16px; opacity: 0.55; }

  /* Huy hiệu Optional */
  .badge-opt {
    display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: color-mix(in srgb, var(--ink) 6%, transparent);
    border: 1px dashed color-mix(in srgb, var(--muted) 35%, transparent);
    letter-spacing: .02em;
  }

  /* Bài kiểm tra điều kiện */
  tr.gate td.item { background: var(--test-bg); color: var(--test); font-weight: 600; }
  tr.gate .line { align-items: flex-start; flex-wrap: nowrap; }
  tr.gate svg { flex: none; width: 17px; height: 17px; margin-top: 2px; }

  /* Dấu sao */
  .star {
    display: inline-block; margin: 0 0 0 2px; padding: 0 2px; border: 0; background: none; cursor: help;
    font: inherit; font-size: 0.85em; font-weight: 700; line-height: 1; vertical-align: 0.25em; color: var(--test);
  }

  #tip {
    position: fixed; z-index: 50; min-width: 180px; max-width: 280px; padding: 10px 14px 12px; border-radius: 10px;
    pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); line-height: 1.4;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .28);
  }
  #tip .tt { font-size: 13px; font-weight: 700; padding-bottom: 7px; margin-bottom: 7px; border-bottom: 1px solid var(--tip-line); }
  #tip .ti { display: flex; gap: 6px; font-size: 13px; font-weight: 500; }

  /* Chú thích */
  .legend {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; font-size: 12.5px; color: var(--muted);
  }
  .legend .key { display: inline-flex; align-items: center; gap: 8px; }
  .legend .star { cursor: default; padding: 0; vertical-align: baseline; }
  .gate-key {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 6px;
    background: var(--test-bg); border: 1px solid var(--test-line); color: var(--test); font-weight: 600;
  }
  .gate-key svg { width: 14px; height: 14px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--bar); background: var(--tint); }
  .legend .hint { margin-left: auto; font-size: 12px; }

  @media (max-width: 640px) {
    .col-time { width: 104px; }
    td.phase { padding: 10px 6px; }
    .pill { font-size: 12px; padding: 3px 8px; }
    thead th { padding: 12px; }
    td.item { padding: 10px 12px; }
    .legend .hint { margin-left: 0; }
  }
</style>

<div class="page">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">KV</div>
      <div>
        <h1 id="main-title">Lộ Trình Đào Tạo KiotViet</h1>
        <p class="sub" id="main-sub">Khối Sales • Khối Dịch Vụ Khách Hàng (DVKH)</p>
      </div>
    </div>
    <!-- Chuyển đổi 2 Khối -->
    <div class="dept-selector" role="tablist" aria-label="Chọn Khối">
      <button class="dept-btn" role="tab" aria-selected="true" data-dept="sales">Khối Sales</button>
      <button class="dept-btn" role="tab" aria-selected="false" data-dept="dvkh">Khối DVKH</button>
    </div>
  </header>

  <div class="controls">
    <div class="filter">
      <span class="filter-label" id="fl">Xem phân luồng vị trí</span>
      <div class="seg" role="group" aria-labelledby="fl" id="seg"></div>
    </div>
    <span class="sub" id="dept-desc" style="margin: 0; font-weight: 500;"></span>
  </div>

  <section class="card" aria-label="Bảng lộ trình đào tạo">
    <div class="scroll">
      <table id="tbl">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer class="legend" id="legend"></footer>
</div>

<div id="tip" role="tooltip" hidden></div>

<script>
  function star(text, tip) { return { text: text, tip: tip || text }; }
  var SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function lineHtml(item, gate) {
    if (item === '—') {
      return '<div class="line"><span class="na">—</span></div>';
    }
    if (typeof item === 'string' && item.toLowerCase() === 'optional') {
      return '<div class="line"><span class="badge-opt">Optional</span></div>';
    }
    if (typeof item === 'string') {
      return '<div class="line">' + (gate ? SHIELD : '') + '<span class="t">' + esc(item) + '</span></div>';
    }
    return '<div class="line"><span class="t">' + esc(item.text) +
      '<button type="button" class="star" data-tip="' + esc(item.tip) + '" aria-label="Có bài kiểm tra: ' + esc(item.tip) + '">*</button></span></div>';
  }

  /* ---------------- 1. DỮ LIỆU KHỐI SALES ---------------- */
  var SALES_DATA = {
    title: 'Lộ Trình Đào Tạo Đội Ngũ Sales',
    sub: 'Phân luồng: Direct Sales & Telesales (Retail / FnB / Booking)',
    desc: 'Lộ trình từ Tuần 1 đến Thử việc (TV1 – TV2)',
    tracks: [
      { id: 'ds',  name: 'Direct Sales (DS)', short: 'DS' },
      { id: 'tsr', name: 'Telesales Retail',  short: 'TS Retail' },
      { id: 'tsf', name: 'Telesales FnB',     short: 'TS FnB' },
      { id: 'tsb', name: 'Telesales Booking', short: 'TS Booking' }
    ],
    phases: [
      { cls: 'w1', label: 'Tuần 1', sub: 'Hội nhập & SPCB', rows: [
        { cells: function() { return { ds: ['Đào tạo Hội nhập'], tsr: ['Đào tạo Hội nhập'], tsf: ['Đào tạo Hội nhập'], tsb: ['Đào tạo Hội nhập'] }; } },
        { cells: function() { return { ds: ['Đào tạo SPCB KV Retail Buổi 1'], tsr: ['Đào tạo SPCB KV Retail Buổi 1'], tsf: ['Đào tạo SPCB KV Retail Buổi 1'], tsb: ['Đào tạo SPCB KV Retail Buổi 1'] }; } },
        { cells: function() { return {
          ds:  ['Đào tạo SPCB KV Retail Buổi 2'],
          tsr: ['Đào tạo SPCB KV Retail Buổi 2'],
          tsf: ['Đào tạo SPCB KV FNB Buổi 2'],
          tsb: ['Đào tạo SPCB KV Salon Buổi 2'] }; } },
        { cells: function() { return {
          ds:  ['Đào tạo SPCB KV Retail Buổi 3'],
          tsr: ['Đào tạo SPCB KV Retail Buổi 3'],
          tsf: ['Đào tạo SPCB KV FNB Buổi 3'],
          tsb: ['Đào tạo SPCB KV Hotel Buổi 3'] }; } },
        { gate: true, cells: function() { return {
          ds:  ['Bài kiểm tra cuối khóa SPCB KiotViet Retail'],
          tsr: ['Bài kiểm tra cuối khóa SPCB KiotViet Retail'],
          tsf: ['Bài kiểm tra cuối khóa SPCB KiotViet FNB'],
          tsb: ['Bài kiểm tra cuối khóa SPCB Booking (Salon + Hotel)'] }; } }
      ] },
      { cls: 'w2', label: 'Tuần 2', sub: 'Quy trình & Kỹ năng', rows: [
        { cells: function() { return { ds: [star('Đào tạo COC-CRM', 'COC-CRM')], tsr: [star('Đào tạo COC-CRM', 'COC-CRM')], tsf: [star('Đào tạo COC-CRM', 'COC-CRM')], tsb: [star('Đào tạo COC-CRM', 'COC-CRM')] }; } },
        { cells: function() { return {
          ds:  [star('Đào tạo kỹ năng cho Direct Sales', 'Kỹ năng Direct Sales')],
          tsr: [star('Đào tạo kỹ năng cho Telesales', 'Kỹ năng Telesales')],
          tsf: [star('Đào tạo kỹ năng cho Telesales', 'Kỹ năng Telesales')],
          tsb: [star('Đào tạo kỹ năng cho Telesales', 'Kỹ năng Telesales')] }; } }
      ] },
      { cls: 'w3', label: 'Thử việc', sub: 'TV1 - TV2', rows: [
        { cells: function() { return { ds: [star('Đào tạo Sản phẩm Kế toán 01', 'Sản phẩm Kế toán 01')], tsr: [star('Đào tạo Sản phẩm Kế toán 01', 'Sản phẩm Kế toán 01')], tsf: [star('Đào tạo Sản phẩm Kế toán 01', 'Sản phẩm Kế toán 01')], tsb: [star('Đào tạo Sản phẩm Kế toán 01', 'Sản phẩm Kế toán 01')] }; } },
        { cells: function() { return {
          ds:  [star('Đào tạo Sản phẩm Retail 01', 'Sản phẩm Retail 01')],
          tsr: [star('Đào tạo Sản phẩm Retail 01', 'Sản phẩm Retail 01')],
          tsf: [star('Đào tạo Sản phẩm FNB 01', 'Sản phẩm FNB 01')],
          tsb: [star('Đào tạo Sản phẩm Salon 01', 'Sản phẩm Salon 01'), star('Đào tạo Sản phẩm Hotel 01', 'Sản phẩm Hotel 01')] }; } },
        { cells: function() { return {
          ds:  ['—'],
          tsr: ['Đào tạo kỹ năng chuyên sâu'],
          tsf: ['Đào tạo kỹ năng chuyên sâu'],
          tsb: ['Đào tạo kỹ năng chuyên sâu'] }; } },
        { cells: function() { return { ds: ['Chương trình Tuân thủ'], tsr: ['Chương trình Tuân thủ'], tsf: ['Chương trình Tuân thủ'], tsb: ['Chương trình Tuân thủ'] }; } }
      ] }
    ],
    legend: [
      '<span class="key"><span class="star" aria-hidden="true">*</span>Có bài kiểm tra</span>',
      '<span class="key"><span class="gate-key">' + SHIELD + 'Bài kiểm tra điều kiện</span></span>',
      '<span class="key"><span class="sw" style="--bar: var(--w1-bar); --tint: var(--w1-bg)"></span>Tuần 1</span>',
      '<span class="key"><span class="sw" style="--bar: var(--w2-bar); --tint: var(--w2-bg)"></span>Tuần 2</span>',
      '<span class="key"><span class="sw" style="--bar: var(--w3-bar); --tint: var(--w3-bg)"></span>Thử việc</span>',
      '<span class="hint">Di chuột hoặc chạm vào * để xem nội dung kiểm tra</span>'
    ]
  };

  /* ---------------- 2. DỮ LIỆU KHỐI DVKH ---------------- */
  var DVKH_DATA = {
    title: 'Lộ Trình Đào Tạo Dịch Vụ Khách Hàng (DVKH)',
    sub: 'Phân luồng: Tổng đài • Upgrade • CS • KShip',
    desc: 'Lộ trình đào tạo 4 tuần chuyên môn DVKH',
    tracks: [
      { id: 'tongdai', name: 'Tổng đài', short: 'Tổng đài' },
      { id: 'upgrade', name: 'Upgrade',  short: 'Upgrade' },
      { id: 'cs',      name: 'CS',       short: 'CS' },
      { id: 'kship',   name: 'KShip',    short: 'KShip' }
    ],
    phases: [
      { cls: 'w1', label: 'Tuần 1', sub: 'Bắt buộc', rows: [
        /* 3 môn tất cả cùng học */
        { cells: function() { return { tongdai: ['Đào tạo Hội nhập'], upgrade: ['Đào tạo Hội nhập'], cs: ['Đào tạo Hội nhập'], kship: ['Đào tạo Hội nhập'] }; } },
        { cells: function() { return { tongdai: ['Đào tạo Sản phẩm Retail 01'], upgrade: ['Đào tạo Sản phẩm Retail 01'], cs: ['Đào tạo Sản phẩm Retail 01'], kship: ['Đào tạo Sản phẩm Retail 01'] }; } },
        { cells: function() { return { tongdai: ['Kế toán 01'], upgrade: ['Kế toán 01'], cs: ['Kế toán 01'], kship: ['Kế toán 01'] }; } },
        /* Môn riêng Tổng Đài 1 */
        { cells: function() { return {
          tongdai: ['Quy trình cuộc gọi DVKH Hotline'],
          upgrade: ['—'],
          cs:      ['—'],
          kship:   ['—'] }; } },
        /* Môn riêng Tổng Đài 2 */
        { cells: function() { return {
          tongdai: ['Hướng dẫn thao tác công cụ làm việc DVKH Hotline'],
          upgrade: ['—'],
          cs:      ['—'],
          kship:   ['—'] }; } },
        /* Môn riêng CS */
        { cells: function() { return {
          tongdai: ['—'],
          upgrade: ['—'],
          cs:      ['Kịch bản chăm sóc khách hàng chủ động & Gia tăng giá trị phần mềm'],
          kship:   ['—'] }; } }
      ] },
      /* Tuần 2: không để sub, 3 khối còn lại để Optional */
      { cls: 'w2', label: 'Tuần 2', sub: '', rows: [
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm Retail 02'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } },
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm FNB 01'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } }
      ] },
      /* Tuần 3: không để sub, 3 khối còn lại để Optional */
      { cls: 'w3', label: 'Tuần 3', sub: '', rows: [
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm Salon 01'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } },
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm Hotel 01'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } }
      ] },
      /* Tuần 4: không để sub, 3 khối còn lại để Optional */
      { cls: 'w4', label: 'Tuần 4', sub: '', rows: [
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm FNB 02'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } },
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm Salon 02'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } },
        { cells: function() { return {
          tongdai: ['Đào tạo Sản phẩm Hotel 02'],
          upgrade: ['Optional'], cs: ['Optional'], kship: ['Optional'] }; } }
      ] }
    ],
    legend: [
      '<span class="key"><span class="badge-opt">Optional</span>Khóa học tùy chọn theo nhu cầu</span>',
      '<span class="key"><span class="sw" style="--bar: var(--w1-bar); --tint: var(--w1-bg)"></span>Tuần 1</span>',
      '<span class="key"><span class="sw" style="--bar: var(--w2-bar); --tint: var(--w2-bg)"></span>Tuần 2</span>',
      '<span class="key"><span class="sw" style="--bar: var(--w3-bar); --tint: var(--w3-bg)"></span>Tuần 3</span>',
      '<span class="key"><span class="sw" style="--bar: var(--w4-bar); --tint: var(--w4-bg)"></span>Tuần 4</span>',
      '<span class="hint">Click từng tab để xem lộ trình đã rút gọn dòng trống</span>'
    ]
  };

  /* ---------------- RENDER ENGINE DYNAMIC ROW ---------------- */
  var currentDept = 'sales';
  var currentView = 'all';
  var tbl = document.getElementById('tbl');
  var thead = document.getElementById('thead');
  var tbody = document.getElementById('tbody');
  var seg = document.getElementById('seg');
  var legend = document.getElementById('legend');

  function getCurrentData() {
    return currentDept === 'sales' ? SALES_DATA : DVKH_DATA;
  }

  function renderTable(view) {
    currentView = view;
    var data = getCurrentData();

    // 1. Xác định các cột hiển thị
    var activeTracks = (view === 'all')
      ? data.tracks
      : data.tracks.filter(function(t) { return t.id === view; });

    if (view === 'all') {
      tbl.classList.remove('single-col');
    } else {
      tbl.classList.add('single-col');
    }

    // 2. Render Header
    thead.innerHTML = '<tr><th class="col-time" scope="col">Giai đoạn</th>' +
      activeTracks.map(function(t) { return '<th scope="col">' + esc(t.name) + '</th>'; }).join('') + '</tr>';

    // 3. Render Body: Tự động loại bỏ các dòng trống khi xem từng tab
    var bodyHtml = '';
    data.phases.forEach(function(p) {
      // Lọc các dòng: nếu xem từng tab thì chỉ giữ lại dòng có khóa học (khác '—')
      var visibleRows = p.rows.filter(function(r) {
        if (view === 'all') return true;
        var cells = r.cells();
        var items = cells[view] || [];
        return items.length > 0 && !items.every(function(it) { return it === '—'; });
      });

      if (visibleRows.length === 0) return;

      visibleRows.forEach(function(r, i) {
        var cls = p.cls + (r.gate ? ' gate' : '') + (i === 0 ? ' first' : '');
        bodyHtml += '<tr class="' + cls + '">';

        // Cột giai đoạn: rowspan tự động theo số dòng thực tế còn lại
        if (i === 0) {
          var subHtml = p.sub ? '<small>' + esc(p.sub) + '</small>' : '';
          bodyHtml += '<td class="phase" rowspan="' + visibleRows.length + '">' +
            '<span class="pill">' + esc(p.label) + '</span>' + subHtml + '</td>';
        }

        var cellsData = r.cells();
        activeTracks.forEach(function(t) {
          var items = cellsData[t.id] || ['—'];
          bodyHtml += '<td class="item">' + items.map(function(it) { return lineHtml(it, r.gate); }).join('') + '</td>';
        });

        bodyHtml += '</tr>';
      });
    });

    tbody.innerHTML = bodyHtml;
    hideTip();
  }

  function renderDept(deptKey) {
    currentDept = deptKey;
    var data = getCurrentData();

    // Cập nhật thông tin Header
    document.getElementById('main-title').textContent = data.title;
    document.getElementById('main-sub').textContent = data.sub;
    document.getElementById('dept-desc').textContent = data.desc;

    // Cập nhật các nút phân luồng vị trí
    var views = [{ id: 'all', label: 'Tất cả vị trí' }].concat(data.tracks.map(function(t) { return { id: t.id, label: t.short }; }));
    seg.innerHTML = views.map(function (v) {
      return '<button type="button" data-view="' + v.id + '" aria-pressed="' + (v.id === 'all') + '">' + esc(v.label) + '</button>';
    }).join('');

    // Cập nhật chú thích Footer
    legend.innerHTML = data.legend.join('');

    // Render bảng ở chế độ Tất cả
    renderTable('all');
  }

  function setView(id) {
    Array.prototype.forEach.call(seg.children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === id));
    });
    renderTable(id);
  }

  // Chuyển khối Sales <-> DVKH
  document.querySelectorAll('.dept-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.dept-btn').forEach(function(b) { b.setAttribute('aria-selected', 'false'); });
      btn.setAttribute('aria-selected', 'true');
      renderDept(btn.dataset.dept);
    });
  });

  // Chuyển vị trí phân luồng
  seg.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]');
    if (b) setView(b.dataset.view);
  });

  /* Tooltip logic */
  var tip = document.getElementById('tip');
  var active = null;
  function showTip(btn) {
    active = btn;
    tip.innerHTML = '<div class="tt">Bài kiểm tra cuối khóa</div><div class="ti"><span>•</span><span>' + esc(btn.dataset.tip) + '</span></div>';
    tip.hidden = false;
    var r = btn.getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    var top = r.top - h - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    btn.setAttribute('aria-expanded', 'true');
  }
  function hideTip() {
    tip.hidden = true;
    if (active) active.removeAttribute('aria-expanded');
    active = null;
  }
  tbody.addEventListener('mouseover', function (e) { var b = e.target.closest('.star'); if (b) showTip(b); });
  tbody.addEventListener('mouseout', function (e) { if (e.target.closest('.star')) hideTip(); });
  tbody.addEventListener('focusin', function (e) { var b = e.target.closest('.star'); if (b) showTip(b); });
  tbody.addEventListener('focusout', hideTip);
  tbody.addEventListener('click', function (e) { var b = e.target.closest('.star'); if (b) showTip(b); });
  document.addEventListener('click', function (e) { if (!e.target.closest('.star')) hideTip(); });
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);

  // Mặc định khởi chạy ở Khối DVKH để bạn tiện kiểm tra ngay
  document.querySelector('.dept-btn[data-dept="dvkh"]').click();
</script>

</body></html>
